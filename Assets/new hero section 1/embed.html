<div id="kg-textured-motion" aria-label="Kiana George portfolio animation">
<style>
#kg-textured-motion{--paper:#fff;--ink:#111;position:relative;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;color-scheme:light;overflow:hidden}#kg-textured-motion .scene{height:560px;position:relative;overflow:hidden}#kg-textured-motion .orbit-donut{position:absolute;left:50%;top:50%;width:180px;height:180px;border-radius:50%;background:var(--color);will-change:transform;display:flex;align-items:center;justify-content:center}#kg-textured-motion .hole{position:absolute;inset:13%;border-radius:50%;background:var(--paper)}#kg-textured-motion .label{position:relative;font:11px monospace;letter-spacing:.3px;color:#35484a;z-index:1}#kg-textured-motion .tag{position:absolute;left:50%;top:50%;background:#fff;border:1px solid #dbe2e3;border-radius:30px;padding:8px 19px;font:11px monospace;color:#405356;white-space:nowrap;will-change:transform}#kg-textured-motion .merged{position:absolute;left:50%;top:50%;width:180px;height:180px;background:#5fcbd0;border-radius:50%;opacity:0;will-change:transform}#kg-textured-motion .headline-mask{position:absolute;left:4%;right:4%;bottom:50%;overflow:hidden;text-align:center;padding-top:10px;padding-bottom:0}#kg-textured-motion h1{font-size:clamp(28px,5.5vw,66px);line-height:.84;letter-spacing:-.045em;font-weight:750;margin:0;transform:translateY(0);will-change:transform}#kg-textured-motion .subhead{position:absolute;top:55%;left:12%;right:12%;margin:0;text-align:center;font-size:16px;line-height:1.5;color:#536063;opacity:0;transform:translateY(16px)}#kg-textured-motion .replay{display:block;margin:0 auto 22px;border:0;background:transparent;color:#536063;font:11px monospace;padding:10px;letter-spacing:1px;cursor:pointer}@media(max-width:480px){#kg-textured-motion .scene{height:460px}#kg-textured-motion h1{font-size:34px}#kg-textured-motion .subhead{font-size:14px;left:8%;right:8%}#kg-textured-motion .tag{padding:7px 12px}}
#kg-textured-motion .spiro{position:absolute;left:50%;top:50%;width:min(76%,510px);height:auto;overflow:visible;transform:translate(-50%,-50%);opacity:.35}#kg-textured-motion .merged{background:linear-gradient(90deg,#9dbdc0 0%,#e2ee0b 33%,#acdaad 66%,#5fcbd0 100%)}#kg-textured-motion h1 .letter{display:inline-block;white-space:pre;will-change:transform;transform:translateY(140%)}#kg-textured-motion .headline-mask{bottom:calc(50% - .08em);padding-bottom:0}#kg-textured-motion .subhead{top:54%}
#kg-textured-motion .headline-mask{top:50%;bottom:auto;left:3%;right:3%;padding:8px 0 12px;transform:translateY(-50%);overflow:visible;clip-path:inset(50% 0 50% 0);will-change:clip-path}#kg-textured-motion h1{line-height:1.08;letter-spacing:-.045em;font-weight:750}#kg-textured-motion .headline-row{display:block;white-space:nowrap;will-change:transform}#kg-textured-motion .subhead{top:66%;font:16px Arial,Helvetica,sans-serif;letter-spacing:0}#kg-textured-motion .merged{will-change:width,height,transform;transform:translate(-50%,-50%)}@media(max-width:480px){#kg-textured-motion .subhead{top:63%;font-size:13px;left:3%;right:3%}}
#kg-textured-motion .orbit-donut{border:0!important;outline:0!important;box-shadow:none!important;background:var(--color);isolation:isolate}#kg-textured-motion .hole{border:0!important;outline:0!important;box-shadow:none!important}#kg-textured-motion .orbit-donut::before,#kg-textured-motion .orbit-donut::after{content:none!important}
#kg-textured-motion .focus-word{position:absolute;left:4%;right:4%;top:50%;transform:translateY(-50%);overflow:hidden;text-align:center;pointer-events:none;opacity:0;color:#152526}#kg-textured-motion .focus-word span{display:block;font-weight:650;letter-spacing:-.045em;line-height:1.2;will-change:transform}#kg-textured-motion .label{font-size:13px}#kg-textured-motion .subhead{font-size:15px}#kg-textured-motion .replay{min-height:44px}
#kg-textured-motion .supporting-word{position:absolute;left:50%;top:50%;font:11px monospace;font-weight:400;letter-spacing:.3px;color:#819496;white-space:nowrap;pointer-events:none;opacity:0;border:0;background:none;box-shadow:none;will-change:transform,opacity}
</style>
<div class="scene" role="img" aria-label="Gather, Connect, Synthesize, and Shape appear in matching typography, one at a time. Four stages, Gather, Connect, Synthesize, and Shape, align into a gradient line and reveal Understanding people. Shaping digital experiences.">
<svg class="spiro" aria-hidden="true" viewBox="-280 -280 560 560"></svg>
<span class="supporting-word" aria-hidden="true">QUESTIONS</span>
<span class="supporting-word" aria-hidden="true">CONVERSATIONS</span>
<span class="supporting-word" aria-hidden="true">PERSPECTIVES</span>
<span class="supporting-word" aria-hidden="true">CONTEXT</span>
<span class="supporting-word" aria-hidden="true">PATTERNS</span>
<span class="supporting-word" aria-hidden="true">INSIGHTS</span>
<span class="supporting-word" aria-hidden="true">STORIES</span>
<span class="supporting-word" aria-hidden="true">STRATEGY</span>
<div class="orbit-donut" style="--color:#9dbdc0"><div class="hole"></div><span class="label">GATHER</span></div>
<div class="orbit-donut" style="--color:#e2ee0b"><div class="hole"></div><span class="label">CONNECT</span></div>
<div class="orbit-donut" style="--color:#acdaad"><div class="hole"></div><span class="label">SYNTHESIZE</span></div>
<div class="orbit-donut" style="--color:#5fcbd0"><div class="hole"></div><span class="label">SHAPE</span></div>
<div class="tag">INSIGHTS</div><div class="tag">RESEARCH</div><div class="tag">INTERVIEWS</div><div class="tag">PROTOTYPING</div><div class="tag">ANALYSIS</div>
<div class="focus-word"><span>Gather</span></div><div class="focus-word"><span>Connect</span></div><div class="focus-word"><span>Synthesize</span></div><div class="focus-word"><span>Shape</span></div><div class="merged"></div>
<div class="headline-mask"><h1><span class="headline-row">Understanding people.</span><span class="headline-row">Shaping digital experiences.</span></h1></div>
<p class="subhead">A journalist’s curiosity. A strategist’s perspective.</p>
</div><button type="button" class="replay">REPLAY ↗</button>
<script>
(()=>{const root=document.getElementById('kg-textured-motion'),scene=root.querySelector('.scene'),rings=[...root.querySelectorAll('.orbit-donut')],tags=[...root.querySelectorAll('.tag')],merged=root.querySelector('.merged'),headline=root.querySelector('h1'),sub=root.querySelector('.subhead');let raf,start;const clamp=t=>Math.max(0,Math.min(1,t));const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};const quint=t=>{t=clamp(t);return t<.5?16*t**5:1-(-2*t+2)**5/2};const lerp=(a,b,t)=>a+(b-a)*t;
const spiro=root.querySelector('.spiro');const ns='http://www.w3.org/2000/svg';for(let k=0;k<8;k++){const path=document.createElementNS(ns,'path');let d='';for(let j=0;j<=1000;j++){const a=j/1000*Math.PI*14;const x=153*Math.cos(a)+72*Math.cos(153/51*a+k*.34),y=153*Math.sin(a)-72*Math.sin(153/51*a+k*.34);d+=(j?'L':'M')+x.toFixed(2)+' '+y.toFixed(2)}path.setAttribute('d',d);path.setAttribute('fill','none');path.setAttribute('stroke',['#9dbdc0','#d9e514','#acdaad','#5fcbd0'][k%4]);path.setAttribute('stroke-width','.7');spiro.appendChild(path)}
const mask=root.querySelector('.headline-mask'),rows=[...root.querySelectorAll('.headline-row')];const out=t=>1-Math.pow(1-clamp(t),4);
const focusWords=[...root.querySelectorAll('.focus-word')],supportingWords=[...root.querySelectorAll('.supporting-word')];
function draw(now){const t=(now-start)/1000,w=scene.clientWidth,f=Math.min(1,w/700);headline.style.fontSize=Math.min(62,w/14.3)+'px';const align=quint((t-5.65)/.48),compress=quint((t-6.3)/.42),stretch=quint((t-6.85)/.48);const positions=[[-65,-140],[-190,10],[175,-6],[23,148]];
// Deliberate reframing, with a readable hold on each word.
const pan1=quint((t-1.04)/.32),pan2=quint((t-2.24)/.32),pan3=quint((t-3.44)/.32),pull=quint((t-4.7)/.72);const fitZoom=Math.min(3.15,(scene.clientHeight-64)/180,(w-48)/(180*Math.max(.58,f)));const zoom=lerp(fitZoom,1,pull);let cx=lerp(65,190,pan1);cx=lerp(cx,-175,pan2);cx=lerp(cx,-23,pan3);let cy=lerp(140,-10,pan1);cy=lerp(cy,6,pan2);cy=lerp(cy,-148,pan3);cx*=f*(1-pull);cy*=f*(1-pull);
spiro.style.opacity=.27*(1-smooth((t-5.5)/.5));spiro.style.transform=`translate(calc(-50% + ${cx*zoom}px),calc(-50% + ${cy*zoom}px)) scale(${zoom*(1-align*.65)}) rotate(${Math.min(t,6)*2.2}deg)`;
rings.forEach((el,i)=>{let x=lerp((positions[i][0]*f+cx)*zoom,0,align),y=lerp((positions[i][1]*f+cy)*zoom,(i-1.5)*99*f,align)*(1-compress);let scale=lerp(Math.max(.58,f)*zoom,.52*f,align);el.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${scale*(1-compress*.96)},${scale*(1+compress*.55)})`;const radius=90*scale;const edge=Math.min(w/2-Math.abs(x)-radius,scene.clientHeight/2-Math.abs(y)-radius);const contained=smooth(edge/24);el.style.opacity=contained*(1-smooth((t-6.55)/.2));el.querySelector('.label').style.fontSize=Math.max(13,11/scale)+'px';el.querySelector('.label').style.opacity=smooth((t-5.12)/.25)*(1-smooth((t-5.9)/.25));el.querySelector('.hole').style.transform=`scale(${1-compress})`});
const texturePositions=[[-155,-224],[48,-205],[-255,-47],[238,-115],[-216,112],[120,75],[-70,230],[210,190]];
supportingWords.forEach((el,i)=>{const [px,py]=texturePositions[i];const x=(px*f+cx)*zoom,y=(py*f+cy)*zoom;el.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) scale(${1+(zoom-1)*.18})`;el.style.opacity=.46*(1-smooth((t-5.25)/.4));});
focusWords.forEach((el,i)=>{const at=i*1.2,local=t-at,enter=out(local/.22),exit=quint((local-.96)/.25),direction=i%2?-1:1;el.style.opacity=local>=0&&local<1.23?'1':'0';const span=el.querySelector('span');span.style.fontSize=Math.min(52,w*.072)+'px';span.style.transform=`translateX(${direction*((1-enter)*w*.2-exit*w*.23)}px) translateY(${(1-enter)*105-exit*105}%)`;});
tags.forEach(el=>el.style.display='none');
const barIn=out((t-6.47)/.2),reveal=out((t-7.33)/.72);let bw=lerp(6,w*.88,stretch),bh=lerp(300*f,5,stretch);merged.style.width=bw+'px';merged.style.height=bh+'px';merged.style.borderRadius='0';merged.style.background=stretch<.05?'linear-gradient(180deg,#9dbdc0,#e2ee0b 33%,#acdaad 66%,#5fcbd0)':'linear-gradient(90deg,#9dbdc0,#e2ee0b 33%,#acdaad 66%,#5fcbd0)';merged.style.opacity=barIn*(1-smooth((t-7.4)/.4));merged.style.transform=`translate(-50%,-50%) scaleY(${1-reveal*.7})`;
mask.style.clipPath=`inset(${(1-reveal)*50}% 0 ${(1-reveal)*50}% 0)`;rows.forEach((el,i)=>{el.style.transform=`translateX(${(i?1:-1)*(1-reveal)*35}px) scaleX(${.87+.13*reveal})`});const subIn=smooth((t-8)/.4);sub.style.opacity=subIn;sub.style.transform=`translateY(${(1-subIn)*8}px)`;if(t<9.35)raf=requestAnimationFrame(draw)}
function play(){cancelAnimationFrame(raf);start=performance.now();raf=requestAnimationFrame(draw)}root.querySelector('button').addEventListener('click',play);const reduced=matchMedia('(prefers-reduced-motion: reduce)');if(reduced.matches){start=performance.now()-12000;draw(performance.now())}else if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)){play();observer.disconnect();}},{threshold:.25});observer.observe(root);}else play();})();
</script>
</div>
