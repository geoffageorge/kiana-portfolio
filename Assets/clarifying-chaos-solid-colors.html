<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clarifying the Chaos — Animation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font-family:Arial,sans-serif}main{width:min(100%,1200px);margin:auto}svg{width:100%;height:auto;display:block;overflow:hidden}.orbit{transform-origin:600px 450px;animation:orbit 10s infinite cubic-bezier(.45,0,.2,1)}.ring{transform-box:fill-box;transform-origin:center;animation:resolve 10s infinite cubic-bezier(.65,0,.25,1)}.r1{--x:-145px;--y:-125px;--a:0deg}.r2{--x:145px;--y:-125px;--a:90deg}.r3{--x:-145px;--y:125px;--a:180deg}.r4{--x:145px;--y:125px;--a:270deg}.threads{animation:fade 10s infinite}.data{animation:fade 10s infinite}.end{transform-origin:600px 450px;animation:finish 10s infinite cubic-bezier(.65,0,.25,1)}
@keyframes orbit{0%{transform:rotate(0)}18%{transform:rotate(35deg)}35%{transform:rotate(-15deg)}52%,100%{transform:rotate(80deg)}}
@keyframes resolve{0%,100%{transform:translate(var(--x),var(--y)) rotate(var(--a));opacity:1}15%{transform:translate(var(--y),var(--x)) rotate(35deg)}30%{transform:translate(var(--x),var(--y)) rotate(-20deg)}40%{transform:translate(var(--x),var(--y))}58%{transform:translate(0,0);opacity:1}66%,90%{transform:translate(0,0);opacity:0}94%{transform:translate(var(--x),var(--y));opacity:0}}
@keyframes fade{0%,30%{opacity:1}55%,92%{opacity:0}100%{opacity:1}}
@keyframes finish{0%,67%{opacity:0;transform:scale(1)}74%{opacity:1;transform:scale(1)}77%,88%{opacity:1;transform:scale(1.18)}94%,100%{opacity:0;transform:scale(1.18)}}
.labels{font:13px monospace;fill:#234352}.pill{transform-box:fill-box;transform-origin:center;animation:labelMove 10s infinite cubic-bezier(.65,0,.25,1)}
@keyframes labelMove{0%,100%{transform:translate(var(--px),var(--py));opacity:1}12%{transform:translate(var(--qx),var(--py))}25%{transform:translate(var(--qx),var(--qy))}38%{transform:translate(var(--px),var(--qy))}49%{transform:translate(var(--px),-316px);opacity:1}57%{transform:translate(0,-316px);opacity:1}67%{transform:translate(var(--stack),-316px);opacity:1}73%,94%{transform:translate(var(--stack),-316px);opacity:0}96%{transform:translate(var(--px),var(--py));opacity:0}100%{opacity:1}}
.final-outline{position:absolute;inset:35px;border-radius:50%;background:conic-gradient(from -37deg,#e8367e 0deg 55deg,#afd3b1 96deg 163deg,#726d71 205deg 236deg,#e5ef18 278deg 319deg,#e8367e 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}.glow-outline{filter:blur(7px);inset:31px;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 11px),#000 calc(100% - 10px));mask:radial-gradient(farthest-side,transparent calc(100% - 11px),#000 calc(100% - 10px))}
.clarity{font:400 24px Arial,sans-serif;letter-spacing:normal;fill:#234352;animation:clarityReveal 10s infinite ease-in-out}
@keyframes clarityReveal{0%,73%{opacity:0}80%,90%{opacity:1}94%,100%{opacity:0}}
.halo{animation:finalGlow 10s infinite ease-in-out}
@keyframes finalGlow{0%,67%{opacity:0;transform:scale(1)}78%{opacity:.65;transform:scale(1.18)}88%{opacity:.4;transform:scale(1.18)}94%,100%{opacity:0;transform:scale(1.18)}}
footer{display:flex;justify-content:center;gap:6px;text-align:center;padding:0 20px 25px;color:#777;font-size:12px}button{background:#fff;border:1px solid #ddd;padding:12px 23px;border-radius:28px;font-size:16px;cursor:pointer;color:#333}body.paused *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){.orbit,.ring,.threads,.data{display:none}.pill{animation:none}.end{animation:none;opacity:1}.clarity{animation:none;opacity:1}}
</style>
<main><svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc"><title id="title">Clarifying the chaos</title><desc id="desc">Pink, sage, gray and yellow solid rings rotate in two dimensions amid a spirograph and research labels, overlap and resolve into a single circle.</desc>
<defs><linearGradient id="ocean" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#e8367e"/><stop offset=".33" stop-color="#afd3b1"/><stop offset=".66" stop-color="#726d71"/><stop offset="1" stop-color="#e5ef18"/></linearGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter></defs>
<g class="threads" fill="none" stroke-width="1.1"></g>
<g class="data" fill="#31869c" font-family="monospace" font-size="15"></g>
<g class="orbit" fill="none" stroke-width="58"><circle class="ring r1" cx="600" cy="450" r="105" stroke="#e8367e"/><circle class="ring r2" cx="600" cy="450" r="105" stroke="#afd3b1"/><circle class="ring r3" cx="600" cy="450" r="105" stroke="#726d71"/><circle class="ring r4" cx="600" cy="450" r="105" stroke="#e5ef18"/></g>
<foreignObject class="end halo" x="425" y="275" width="350" height="350"><div xmlns="http://www.w3.org/1999/xhtml" class="final-outline glow-outline"></div></foreignObject><foreignObject class="end" x="425" y="275" width="350" height="350"><div xmlns="http://www.w3.org/1999/xhtml" class="final-outline"></div></foreignObject>
<g class="labels" text-anchor="middle" style="font-size:17px"><g class="pill" style="--px:-50px;--py:-200px;--qx:40px;--qy:-160px;--stack:432.5px"><rect x="95" y="745" width="145" height="42" rx="21" fill="white" fill-opacity=".95" stroke="#b5c8cb" stroke-width="1"/><text x="167.5" y="772">INSIGHTS</text></g><g class="pill" style="--px:200px;--py:-350px;--qx:150px;--qy:-300px;--stack:281.5px"><rect x="246" y="745" width="145" height="42" rx="21" fill="white" fill-opacity=".95" stroke="#b5c8cb" stroke-width="1"/><text x="318.5" y="772">RESEARCH</text></g><g class="pill" style="--px:-260px;--py:-60px;--qx:-300px;--qy:-120px;--stack:120.5px"><rect x="397" y="745" width="165" height="42" rx="21" fill="white" fill-opacity=".95" stroke="#b5c8cb" stroke-width="1"/><text x="479.5" y="772">INTERVIEWS</text></g><g class="pill" style="--px:160px;--py:-120px;--qx:100px;--qy:-80px;--stack:-60.5px"><rect x="568" y="745" width="185" height="42" rx="21" fill="white" fill-opacity=".95" stroke="#b5c8cb" stroke-width="1"/><text x="660.5" y="772">PROTOTYPING</text></g><g class="pill" style="--px:70px;--py:-390px;--qx:90px;--qy:-220px;--stack:-226.5px"><rect x="759" y="745" width="135" height="42" rx="21" fill="white" fill-opacity=".95" stroke="#b5c8cb" stroke-width="1"/><text x="826.5" y="772">TESTING</text></g></g><text class="clarity" x="600" y="450" text-anchor="middle" dominant-baseline="middle">Clarity</text></svg></main><footer><button id="pause" aria-label="Pause animation">Pause</button> <button id="replay">Replay</button></footer>
<script>
const ns='http://www.w3.org/2000/svg',threads=document.querySelector('.threads'),data=document.querySelector('.data');
for(let i=0;i<25;i++){let e=document.createElementNS(ns,'ellipse');e.setAttribute('cx',600);e.setAttribute('cy',450);e.setAttribute('rx',180+i*7);e.setAttribute('ry',74+i*3);e.setAttribute('stroke','url(#ocean)');e.setAttribute('opacity',.28);e.setAttribute('transform',`rotate(${i*23} 600 450)`);let a=document.createElementNS(ns,'animateTransform');a.setAttribute('attributeName','transform');a.setAttribute('type','rotate');a.setAttribute('values',`${i*23} 600 450;${i*23+(i%2?100:-100)} 600 450`);a.setAttribute('dur',`${12+i%5}s`);a.setAttribute('repeatCount','indefinite');e.append(a);threads.append(e)}
for(let i=0;i<32;i++){let t=document.createElementNS(ns,'text'),a=i*2.39996,r=220+(i%5)*32;t.setAttribute('x',600+Math.cos(a)*r);t.setAttribute('y',450+Math.sin(a)*r);t.setAttribute('opacity',.35);t.textContent=i%3?'1':'0';data.append(t)}
document.querySelector('#pause').onclick=function(){let p=document.body.classList.toggle('paused');document.querySelector('svg')[p?'pauseAnimations':'unpauseAnimations']();this.textContent=p?'Play':'Pause'};
document.querySelector('#replay').onclick=()=>{document.body.classList.remove('paused');document.querySelector('#pause').textContent='Pause';let s=document.querySelector('svg');s.unpauseAnimations();s.setCurrentTime(0);document.querySelectorAll('.orbit,.ring,.threads,.data,.end,.pill,.clarity').forEach(e=>{e.style.animation='none';void e.getBoundingClientRect();e.style.animation=''})};
</script></html>
